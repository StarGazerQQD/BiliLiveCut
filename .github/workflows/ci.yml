# BiliLiveCut CI (V0.1.20.2 Alpha)
# 触发: push/PR 到 main → lint → audit + test → portable → coverage summary
#
# Job 结构:
#   lint       — 与本地提交共用 pre-commit 配置
#   audit      — Portable Windows runtime lock pip-audit (阻断式)
#   test       — Linux/Windows 多 Python → pytest + coverage (≥50%)
#   uv-test    — Linux/Windows 锁文件、源码安装和原生扩展验证
#   test-macos — main 推送、PR 或手动验收时运行 macOS py3.12
#   portable   — Payload 构建 + Portable 全部测试
#   coverage   — 汇总多矩阵覆盖率报告

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 每周一 08:00 UTC 跑一次依赖审计
    - cron: "0 8 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# ═══════════════════════════════════════════════════════════════════
# Job 1: Lint — 极速失败 (ruff + version + release_audit)
# ═══════════════════════════════════════════════════════════════════
jobs:
  lint:
    name: "lint"
    timeout-minutes: 10
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4  # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5  # v5.4.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Install pre-commit
        run: python -m pip install pre-commit==4.6.2

      - name: Cache hook environments
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-py312-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run shared pre-commit checks
        run: python -m pre_commit run --all-files --show-diff-on-failure

# ═══════════════════════════════════════════════════════════════════
# Job 2: Audit — Portable Windows runtime locks (fail-closed)
# ═══════════════════════════════════════════════════════════════════
  audit:
    name: "audit"
    needs: lint
    if: always() && !cancelled() && (github.event_name == 'schedule' || needs.lint.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      - name: Audit Portable runtime locks
        run: python scripts/audit_portable_runtime_locks.py

# ═══════════════════════════════════════════════════════════════════
# Job 3: Test — 全矩阵 pytest + coverage ≥ 50%
# ═══════════════════════════════════════════════════════════════════
  test:
    name: "${{ matrix.os }} / py${{ matrix.python-version }}"
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Node.js for frontend tests
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Install FFmpeg (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        # 共用 Release 下载器；验证产物后直接导出真实二进制路径，避免包管理器假成功和 ShimGen。
        run: |
          python scripts/download_release_ffmpeg.py --output-dir "$env:RUNNER_TEMP/ffmpeg/bin" --github-env "$env:GITHUB_ENV"
          if ($LASTEXITCODE -ne 0) { throw "FFmpeg provisioning or validation failed" }
          "$env:RUNNER_TEMP/ffmpeg/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        timeout-minutes: 15

      - name: Install Python dev deps
        shell: bash
        run: |
          python -m pip install --upgrade pip "setuptools>=84.1.0" "Cython==3.2.9"
          pip install -e ".[dev,web]"
          python setup.py build_ext --inplace

      - name: Verify frontend process supervision (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          ASR_NO_MODEL_DOWNLOAD: "1"
        run: python -m pytest tests/integration/test_frontend_console.py --timeout=120 --fail-on-skip
        timeout-minutes: 3

      - name: Verify SSE state events (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          ASR_NO_MODEL_DOWNLOAD: "1"
        run: python -m pytest tests/integration/test_state_events.py --timeout=60 --fail-on-skip --tb=long -vv --durations=10
        timeout-minutes: 5

      # 实际日志显示发行包用例占用约 285 秒；独立验收保留全部检查和各步时限。
      - name: Run real sdist and wheel integration
        shell: bash
        env:
          ASR_NO_MODEL_DOWNLOAD: "1"
        run: python -m pytest tests/integration/test_wheel_frontend.py --fail-on-skip --durations=10
        timeout-minutes: 15

      # Windows/Python 3.11 的 3358 项全部通过仍耗时 897.96 秒，需为收尾保留余量。
      # 应用测试单项限时 120 秒；发行包构建仍使用上方独立步骤的预算。
      - name: Run pytest with coverage (≥50%)
        shell: bash
        env:
          ASR_NO_MODEL_DOWNLOAD: "1"
          PYTEST_ADDOPTS: "--timeout=120"
        run: python scripts/run_coverage.py --application-only
        timeout-minutes: 30

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 7
          if-no-files-found: error

      - name: Upload coverage report (backup — even if xml not found)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-raw-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            .coverage
            coverage.xml
          retention-days: 3
          if-no-files-found: warn

      - name: Upload pytest output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-stdout-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            /tmp/pytest-output-*.log
          retention-days: 7
          if-no-files-found: warn

  uv-test:
    name: "uv / ${{ matrix.os }} / py3.12 / ${{ matrix.mode }}"
    needs: lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            mode: native
            skip-extensions: "0"
          - os: windows-latest
            mode: native
            skip-extensions: "0"
          - os: ubuntu-latest
            mode: python
            skip-extensions: "1"
    env:
      ASR_NO_MODEL_DOWNLOAD: "1"
      BLC_SKIP_C_EXTENSIONS: ${{ matrix.skip-extensions }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.18"
          enable-cache: true
      - name: Check dependency lock
        run: uv lock --check
      - name: Install runtime without development tools
        run: uv sync --locked --no-dev --extra web
      - name: Verify installed command
        run: uv run --locked --no-dev --extra web blc --help
      - name: Install default development environment
        run: uv sync --locked
      - name: Require native extensions
        if: matrix.mode == 'native'
        run: uv run --locked python -c "from app.accelerators import _c_speedups, _cython_speedups, _repeat_speedups; from app.accelerators.dispatcher import get_repeat_backend; assert get_repeat_backend() == 'C++'; assert _repeat_speedups.consecutive_repeat_details('abc' * 100) == (0, 3, 100)"
      - name: Verify Python fallback installation
        if: matrix.mode == 'python'
        run: |
          uv run --locked python -c "import importlib.util; from app.accelerators.dispatcher import get_backend, get_repeat_backend; assert importlib.util.find_spec('app.accelerators._c_speedups') is None; assert importlib.util.find_spec('app.accelerators._cython_speedups') is None; assert importlib.util.find_spec('app.accelerators._repeat_speedups') is None; assert get_repeat_backend() == 'python'; assert get_backend() == 'python'"
      - name: Run focused tests
        shell: bash
        run: |
          uv run --locked python -m pytest tests/unit/test_native_parity.py tests/unit/test_accelerator_fallback_parity.py tests/unit/test_quality_gate.py tests/unit/test_cpu_asr_statistics.py tests/unit/test_repeat_dispatch.py --timeout=120 --fail-on-skip

# macOS 原生行为必须在 PR 合并前验收；main 推送和手动验收也执行。
# 全量覆盖测试曾在 99% 进度触及 45 分钟上限；步骤预算扩为 90 分钟。
# job 总预算 120 分钟，为依赖安装及覆盖率上传额外保留 30 分钟。
# 独立 job 可使用真正的 job-level if；matrix.include 中的 if 只是普通数据字段。
  test-macos:
    name: "macos-latest / py3.12"
    if: github.event_name != 'schedule'
    needs: lint
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      BLC_SKIP_C_EXTENSIONS: "0"
      CC: clang
      CXX: clang++

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Node.js for frontend tests
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Install FFmpeg with subtitle and text filters
        shell: bash
        run: |
          set -euo pipefail
          brew install ffmpeg-full
          # ffmpeg-full 为 keg-only，不能依赖 PATH 中已有的普通版。
          ffmpeg_bin="$(brew --prefix --installed ffmpeg-full)/bin"
          test -x "$ffmpeg_bin/ffmpeg"
          test -x "$ffmpeg_bin/ffprobe"
          "$ffmpeg_bin/ffmpeg" -hide_banner -version
          "$ffmpeg_bin/ffprobe" -hide_banner -version
          filters="$("$ffmpeg_bin/ffmpeg" -hide_banner -filters)"
          for required_filter in subtitles drawtext; do
            if ! printf '%s\n' "$filters" | awk -v filter="$required_filter" '$2 == filter { found = 1 } END { exit !found }'; then
              echo "::error::Required FFmpeg filter '$required_filter' is missing from $ffmpeg_bin/ffmpeg"
              exit 1
            fi
          done
          printf '%s\n' "$ffmpeg_bin" >> "$GITHUB_PATH"
          printf 'FFMPEG_PATH=%s/ffmpeg\n' "$ffmpeg_bin" >> "$GITHUB_ENV"
          printf 'FFPROBE_PATH=%s/ffprobe\n' "$ffmpeg_bin" >> "$GITHUB_ENV"

      - name: Install Python dev deps
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,web]"

      - name: Require Clang native extensions
        shell: bash
        run: |
          python -c "from app.accelerators import _c_speedups, _cython_speedups, _repeat_speedups; from app.accelerators.dispatcher import get_repeat_backend; assert get_repeat_backend() == 'C++'; assert _repeat_speedups.consecutive_repeat_details('abc' * 100) == (0, 3, 100)"

      - name: Prepare explicit loopback address for frontend tests
        shell: bash
        run: |
          # macOS 需要显式配置第二个回环地址，保留具体监听地址的真实验收。
          sudo ifconfig lo0 inet 127.0.0.2 netmask 255.255.255.255 alias
          python -c "import socket; probe = socket.socket(); probe.bind(('127.0.0.2', 0)); probe.close()"

      - name: Verify process cleanup, frontend startup and service shutdown
        shell: bash
        env:
          ASR_NO_MODEL_DOWNLOAD: "1"
        run: python -m pytest tests/unit/test_process_tree.py tests/unit/test_process_control.py tests/unit/test_service_shutdown.py tests/integration/test_frontend_console.py --timeout=120 --fail-on-skip
        timeout-minutes: 10

      - name: Run pytest with coverage (>=50%)
        shell: bash
        env:
          ASR_NO_MODEL_DOWNLOAD: "1"
        run: python scripts/run_coverage.py
        timeout-minutes: 90

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-macos-latest-py3.12
          path: coverage.xml
          retention-days: 7
          if-no-files-found: error

      - name: Upload coverage report (backup - even if xml not found)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-raw-macos-latest-py3.12
          path: |
            .coverage
            coverage.xml
          retention-days: 3
          if-no-files-found: warn

      - name: Upload pytest output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-stdout-macos-latest-py3.12
          path: |
            /tmp/pytest-output-*.log
          retention-days: 7
          if-no-files-found: warn

# ═══════════════════════════════════════════════════════════════════
# Job 4: Portable 测试 + Payload 构建
# ═══════════════════════════════════════════════════════════════════
  portable-test:
    name: "portable-test"
    needs: lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,web]"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Build Payload
        run: |
          cd packaging/portable
          python build_payload.py
        timeout-minutes: 20

      - name: Run Portable + Engine Pack tests
        run: python -m pytest packaging/portable/tests/ --tb=short -v --timeout=120 --fail-on-skip
        timeout-minutes: 15

      - name: Ruff check portable modules
        run: ruff check packaging/portable/src/ packaging/portable/tests/

# ═══════════════════════════════════════════════════════════════════
# Job 5: 汇总覆盖率
# ═══════════════════════════════════════════════════════════════════
  coverage-summary:
    name: "coverage summary"
    needs: [test, test-macos]
    runs-on: ubuntu-latest
    if: always() && !cancelled() && github.event_name != 'schedule'
    steps:
      - name: Download all coverage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: coverage-artifacts
          # 每个矩阵保留自己的目录，避免同名 coverage.xml 互相覆盖。
          merge-multiple: false

      - name: Show coverage files
        run: |
          echo "Coverage files collected:"
          if [ -d coverage-artifacts ]; then
            ls -la coverage-artifacts/ || echo "(empty)"
          else
            echo "(no coverage directory — test jobs were skipped)"
          fi

      - name: Summary
        run: |
          echo "All matrix tests complete. Coverage reports archived."

  ci-status:
    name: "CI status"
    needs: [lint, audit, test, uv-test, test-macos, portable-test, coverage-summary]
    if: always() && !cancelled() && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Require all applicable checks to pass
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          AUDIT_RESULT: ${{ needs.audit.result }}
          TEST_RESULT: ${{ needs.test.result }}
          UV_RESULT: ${{ needs.uv-test.result }}
          PORTABLE_RESULT: ${{ needs.portable-test.result }}
          COVERAGE_RESULT: ${{ needs.coverage-summary.result }}
          MACOS_RESULT: ${{ needs.test-macos.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          for result in "$LINT_RESULT" "$AUDIT_RESULT" "$TEST_RESULT" "$UV_RESULT" "$PORTABLE_RESULT" "$COVERAGE_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "::error::A required CI job finished with $result"
              exit 1
            fi
          done
          if [ "$EVENT_NAME" = "push" ] || [ "$EVENT_NAME" = "pull_request" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            test "$MACOS_RESULT" = "success"
          else
            echo "Unexpected CI event: $EVENT_NAME"
            exit 1
          fi
