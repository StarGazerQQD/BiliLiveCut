[project]
name = "bili-live-cut"
version = "0.1.20.2-alpha"
description = "AI 直播实时切片系统:监听 Bilibili 直播,自动录制、转写、识别高光、生成切片与文案"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "tools/native/repeat/vendor/libsais/LICENSE"]
requires-python = ">=3.11"

# 阶段1(本地录制 MVP)所需的核心运行依赖。
# AI 相关重型依赖(faster-whisper / anthropic 等)放到可选 extras,
# 避免在仅需录制时被迫安装,也规避新版本 Python 的 wheel 兼容问题。
dependencies = [
    "anyio>=4.0",             # 同步模型 SDK 通过可取消的异步 HTTP 连接执行请求
    "httpx>=0.27",            # 异步 HTTP 客户端:调用 B 站公开接口
    "pydantic>=2.7",          # 数据校验
    "pydantic-settings>=2.3", # 从 .env / 环境变量读取配置
    "sqlmodel>=0.0.22,<0.0.45", # 0.0.45 改变默认 datetime 存储语义，当前 Schema 仍使用无时区 UTC
    "loguru>=0.7",            # 结构化日志
    "click>=8.1.7,<9",        # 命令行入口
    "rich>=13.7",             # 终端美化输出
    "websockets>=12.0",       # 弹幕 WebSocket 长连接
    "brotli>=1.2.1",          # 弹幕协议解压，包含 CVE-2026-111497 的官方修复
    "pyyaml>=6.0",            # 读取评分权重配置
    "psutil>=7.2.2",          # 实测内存及进程资源
    "numpy>=1.26",            # 音频特征计算(RMS 包络、静音检测)
    "filelock>=4.2.1",        # 共享预算账本与模型缓存锁，包含官方安全修复
    "rapidfuzz>=3.14.6,<4",   # CPU 精确编辑距离；Windows wheel 随附所需 C++ 运行库
]

[project.optional-dependencies]
# 阶段2+: 语音转写。faster-whisper 依赖 ctranslate2,
# 若当前 Python 版本无预编译 wheel,请改用 Python 3.11/3.12 虚拟环境。
asr-whisper = [
    "faster-whisper>=1.0",
    "huggingface-hub==1.30.0", # 修复 Hub 绝对重定向；与 Portable 和真实 SDK 回归测试一致
    "setuptools>=84.1.0", # ASR 传递依赖与构建工具保持已修复的安全下限
    "av>=11,<19", # faster-whisper 1.2.1 仍使用 PyAV 19 已移除的 metadata_errors 参数
]
# V0.1.12.2: Paraformer-zh / SenseVoice-Small / Fun-ASR-Nano 所需依赖。
asr-funasr = [
    "bili-live-cut[asr-whisper]", # 所有后端共用 faster-whisper 提供的 CPU Silero VAD
    "funasr>=1.0",
    "modelscope>=1.20",
    "hydra-core>=1.3.8", # 阻止通过模型配置调用不安全的 YAML 加载器
    "msgpack>=1.2.4", # 修复解码内存安全问题并限制容器预分配
]
# V0.1.12.2: 全部 ASR 后端 (Whisper + FunASR 多引擎)。
asr-all = [
    "bili-live-cut[asr-whisper,asr-funasr]",
]
# 阶段3+:文案与高光 LLM 复核(OpenAI 兼容协议,境内对接 DeepSeek/通义/Kimi/GLM)。
llm = [
    "openai>=1.40",
]
# 阶段4+:Web 后台。
web = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.18",
    "playwright>=1.61,<1.62",
    "qrcode==8.2",           # 网页扫码生成 SVG，无需 Pillow 或服务器浏览器
]
# 开发与测试工具。
dev = [
    "bili-live-cut[llm]", # 路由回归通过真实 SDK 验证请求，仅替换外部 HTTP 边界
    "bili-live-cut[asr-whisper]", # 回归测试使用真实 CPU VAD/音频解码，不下载转写模型
    "modelscope-hub==0.2.0", # 验证锁定 SDK 的文件清单与半下载失败边界
    "Cython==3.2.9",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.4,<3",
    "pre-commit==4.6.2",
    "pip-audit>=2.7",
    "ruff==0.16.10", # 与 .pre-commit-config.yaml 保持一致
    "Pillow>=10.0",
    "build>=1.2",
    "check-manifest>=0.51",
    "markdown-it-py>=4.2,<5", # 鸣谢检查器使用正式 Markdown 解析器，避免把代码示例误认为名单
    "twine>=6.0",
]

[project.scripts]
# 安装后可直接用 `blc` 命令调用 CLI。
blc = "app.cli:main"

[dependency-groups]
# uv 默认安装开发环境；复用 pip extras，避免维护两份依赖清单。
# 构建工具与可复现 bootstrap wheel 构建器一致。
dev = ["bili-live-cut[dev,web]", "setuptools==84.1.0", "wheel==0.47.0"]

[tool.uv]
# 原生源文件或跳过开关变化后重新构建，避免复用不匹配的 editable wheel。
cache-keys = [
    { file = "pyproject.toml" },
    { file = "setup.py" },
    { file = "frontend/*.json" },
    { file = "frontend/*.ts" },
    { file = "frontend/index.html" },
    { file = "frontend/src/**/*" },
    { file = "frontend/public/**/*" },
    { file = "tools/native/c/*.c" },
    { file = "tools/native/cython/*.pyx" },
    { file = "tools/native/repeat/**/*.cpp" },
    { file = "tools/native/repeat/**/*.hpp" },
    { file = "tools/native/repeat/vendor/libsais/src/*.c" },
    { file = "tools/native/repeat/vendor/libsais/include/*.h" },
    { env = "BLC_SKIP_C_EXTENSIONS" },
]

[build-system]
requires = ["setuptools>=84.1.0", "Cython==3.2.9"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["app", "app.*", "config"]

[tool.setuptools.package-data]
"app.web" = ["ui/*", "ui/**/*"]
"config" = ["*.yaml", "*.txt"]

[tool.setuptools.data-files]
"share/bili-live-cut/docs/development" = ["docs/development/live-source-plugins.md", "docs/development/douyin-plugin-handoff.md"]
"share/bili-live-cut/plugin" = ["plugin/README.md", "plugin/manifest.schema.json"]
"share/bili-live-cut/plugin/live-source-example" = [
    "plugin/live-source-example/plugin.json",
    "plugin/live-source-example/main.py",
    "plugin/live-source-example/README.md",
]

[tool.check-manifest]
ignore = [
    ".cursor/rules/commit-language.mdc",
    ".dockerignore",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# E/F=pyflakes, I=isort, UP=pyupgrade, B=bugbear, D=pydocstyle(PEP257)
select = ["E", "F", "I", "UP", "B", "D"]
# D203/D213 与 D211/D212 冲突,二选一。
# D400/D415/D403 要求 docstring 首行以英文句号结尾/英文首字母大写,
# 与中文 docstring(句号「。」)冲突,故忽略。
# D107 不强制 __init__ 单独 docstring(类已用 :param: 说明参数)。
ignore = ["D203", "D213", "D400", "D415", "D403", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D100", "D101", "D102", "D103", "E501"]  # 测试文件放宽 docstring 和行长要求
"packaging/portable/tests/**/*.py" = ["D100", "D101", "D102", "D103", "E501"]  # 可移植测试文件放宽
"packaging/portable/**/*.py" = ["E402", "D100", "D103"]  # 构建脚本需修改 sys.path 后再导入

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "packaging/portable/tests"]
addopts = "--tb=short -q"
markers = [
    "unit: Unit tests (fast, no IO)",
    "integration: Integration tests (moderate speed, some IO)",
    "artifact: Artifact tests (requires built EXE/ZIP)",
    "windows: Windows-only tests",
    "offline: Offline / no-network tests",
    "release: Release-gating tests",
]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
fail_under = 50  # V0.1.12.9: 初始门槛 50%, 后续提升至 70%
precision = 2     # V0.1.14.11: 两位小数，避免 CI 显示 47% 而本地显示 48% 的误判
