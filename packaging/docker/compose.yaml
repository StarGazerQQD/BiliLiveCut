# BiliLiveCut 容器编排 (V0.1.20.2 Alpha)
# 用法:
#   docker compose -f packaging/docker/compose.yaml up --build
#   打开 http://localhost:8000
#
# 说明:
# - 构建上下文为仓库根目录，Dockerfile 在 packaging/docker/Dockerfile
# - 运行产物(数据库、录制片段、切片、清单、日志)持久化到 ./storage 宿主目录;
# - 配置通过 .env 注入(不要把 .env 提交到版本库);
# - MVP 使用 SQLite + 进程内 asyncio,无需额外的 Redis/Celery。
#   若后续要扩展到分布式任务队列,可在此追加 redis 与 worker 服务。

services:
  app:
    build:
      context: ../..
      dockerfile: packaging/docker/Dockerfile
    image: bili-live-cut:latest
    container_name: bili-live-cut
    restart: unless-stopped
    init: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 60s
    expose:
      - "8000"
    env_file:
      - ../../.env
    environment:
      # 覆盖为容器内路径(优先级高于 .env)。
      DOCKER_AUTH_ENABLED: "true"
      FORWARDED_ALLOW_IPS: "*"
      STORAGE_ROOT: /data
      DATABASE_URL: sqlite:////data/blc.db
      PLUGIN_DIR: /data/plugins
      BLC_APP_ROOT: /data
      HF_HOME: /data/cache/huggingface
      MODELSCOPE_CACHE: /data/cache/modelscope
      PLAYWRIGHT_BROWSERS_PATH: /data/cache/playwright
    volumes:
      - ../../storage:/data
      # 模型和浏览器缓存位于 /data/cache，随 storage 一起持久化。

  frontend:
    build:
      context: ../..
      dockerfile: frontend/Dockerfile
    image: bili-live-cut-frontend:latest
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "8000:8080"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
