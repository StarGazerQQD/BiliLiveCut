map $uri $blc_cache_control {
    default "no-store";
    ~^/assets/ "public, max-age=31536000, immutable";
}
map $uri $blc_service_worker_scope {
    default "";
    /media-auth.js "/";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 2m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header Cache-Control $blc_cache_control;
    add_header Service-Worker-Allowed $blc_service_worker_scope always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob:; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;

    location ~ "^/api/recording-imports/[0-9a-f]{32}/files/video$" {
        client_max_body_size 50g;
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP "";
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
    location ~ "^/api/recording-imports/[0-9a-f]{32}/files/comments$" {
        client_max_body_size 32m;
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP "";
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location ~ ^/api/(transcripts|rooms)/[0-9]+$ {
        client_max_body_size 4m;
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP "";
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
    location ~ ^/api/model-configuration(/test)?$ {
        client_max_body_size 8m;
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP "";
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location ~ ^/(api(?:/|$)|auth(?:/|$)|review/api(?:/|$)|collection/api(?:/|$)|openapi\.json$) {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP "";
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
    location /assets/ {
        try_files $uri =404;
    }
    location = /media-auth.js {
    }
    location / {
        try_files $uri $uri/ @spa;
    }
    location @spa {
        # 仅前端路由回退，缺失资源与未知 API 不返回 HTML。
        if ($uri !~ "^/(rooms|recording|imports|schedules|transcripts|danmaku|sessions|topics|clips|uploads|trends|tasks|analytics|monitor|logs|settings(/(configuration|automation|llm|login|plugins|subtitles|intros|notifications))?|review(/(queue|[0-9]+))?|collection/[0-9]+|plugins/[^/]+/settings)?/?$") { return 404; }
        rewrite ^ /index.html last;
    }
}
